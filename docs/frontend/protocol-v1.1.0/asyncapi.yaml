asyncapi: 3.0.0
info:
  title: Discovery WebSocket server
  version: 1.1.0
  description: Server perspective. Discovery 1.1.0 learning, quizzes, competition
    and aura. See docs/GAMEPLAY_V1.1.md.
defaultContentType: application/json
servers:
  lan:
    host: discovery.lan
    protocol: wss
    description: Same trusted origin as HTTP; discovery.v1 subprotocol.
channels:
  game:
    address: /api/v1/ws
    description: Query ticket from POST ws-ticket; never log ticket. Origin
      allowlist required.
    messages:
      client.hello:
        $ref: "#/components/messages/client.hello"
      player.input:
        $ref: "#/components/messages/player.input"
      npc.interact:
