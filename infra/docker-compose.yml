services:
  db:
    image: postgres:latest
    container_name: discovery-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: discovery
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - db_data:/var/lib/postgresql
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d discovery"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - discovery-net

  server:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: discovery-server
    restart: unless-stopped
    environment:
      DB_HOST: "db"
      DB_PORT: "5432"
      DB_USER: "postgres"
      DB_PASSWORD: "postgres"
      DB_NAME: "discovery"
      PORT: "8080"
      HOST: "0.0.0.0"
      WORLD_ID: "discovery-campus"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - discovery-net

  caddy:
    image: caddy:latest
    container_name: discovery-caddy
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - server
    networks:
      - discovery-net

networks:
  discovery-net:
    driver: bridge

volumes:
  db_data:
  caddy_data:
  caddy_config:
